<link href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css' rel='stylesheet'/>
<style>
  :root {
    --primary-color: #ffcc00;
    --subscribe-color: #ff0000;
    --light-bg: rgba(255,255,255,0.8);
    --light-text: #222;
    --dark-bg: rgba(20,20,20,0.8);
    --dark-text: #fff;
  }

  /* Footer mungil lonjong */
  footer.mini-footer {
    position: fixed;
    bottom: 58px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--light-bg);
    color: var(--light-text);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 10px;
    font-family: Arial, sans-serif;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    z-index: 900;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
  }
  @media (prefers-color-scheme: dark) {
    footer.mini-footer { background: var(--dark-bg); color: var(--dark-text); }
  }

  /* Navbar mungil */
  .mini-nav {
    position: fixed;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--light-bg);
    border-radius: 30px;
    display: flex;
    gap: 12px;
    padding: 4px 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    z-index: 1000;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards;
  }
  .mini-nav a {
    color: var(--light-text);
    font-size: 11px;
    text-decoration: none;
    display: flex;
    align-items: center;
    transition: all 0.2s ease;
  }
  .mini-nav a i { font-size: 13px; margin-right: 3px; }
  .mini-nav a:hover { color: var(--primary-color); }
  @media (prefers-color-scheme: dark) {
    .mini-nav { background: var(--dark-bg); }
    .mini-nav a { color: var(--dark-text); }
  }

  /* Tombol Subscribe mungil dengan border pelangi + glow + floating */
  .mini-subscribe {
    position: fixed;
    right: 12px;
    bottom: 100px;
    background: var(--subscribe-color);
    color: #fff;
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 30px;
    text-decoration: none;
    font-weight: bold;
    z-index: 1100;
    display: inline-block !important;
    opacity: 0;
    animation: fadeUp 1s ease forwards, glowPulse 2s infinite, floatBounce 3s ease-in-out infinite;
    border: 2px solid transparent;
    background-clip: padding-box;
    position: relative;
  }

  /* Border pelangi */
  .mini-subscribe::before {
    content: &quot;&quot;;
    position: absolute;
    inset: -2px;
    border-radius: 30px;
    padding: 2px;
    background: linear-gradient(90deg, red, orange, yellow, green, blue, indigo, violet, red);
    background-size: 400%;
    -webkit-mask: 
      linear-gradient(#fff 0 0) content-box, 
      linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    animation: rainbow 4s linear infinite;
  }

  .mini-subscribe:hover {
    background: #cc0000;
    transform: scale(1.1);
  }

  /* Animasi border pelangi */
  @keyframes rainbow {
    0% { background-position: 0% 50%; }
    100% { background-position: 400% 50%; }
  }

  /* Efek glow kedip */
  @keyframes glowPulse {
    0%, 100% { box-shadow: 0 0 6px rgba(255,0,0,0.6); }
    50% { box-shadow: 0 0 14px rgba(255,0,0,0.9); }
  }

  /* Animasi melayang naik-turun */
  @keyframes floatBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  /* Animasi muncul */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(15px) translateX(-50%); }
    to { opacity: 1; transform: translateY(0) translateX(-50%); }
  }
</style>

